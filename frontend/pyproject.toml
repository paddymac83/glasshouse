[project]
name = "glasshouse-frontend"
version = "0.1.0"
description = "Django + DRF dashboard and REST API for Glasshouse -- a parallel implementation of api/'s role, plus the actual UI."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "glasshouse-ingestion",
    "glasshouse-forecast",
    "glasshouse-settlement",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]
deploy = [
    "gunicorn>=22",
    "whitenoise>=6",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasshouse_frontend", "pricing"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "glasshouse_frontend.settings"
testpaths = ["pricing/tests"]

# Local, editable path dependencies -- same pattern as api/pyproject.toml.
# See docs/adr/0001-python-rust-boundary.md for why glasshouse-settlement
# is a compiled Rust extension: this is what lets pricing/services.py
# import and call it in-process, no HTTP hop, same as api/ does.
[tool.uv.sources]
glasshouse-ingestion = { path = "../ingestion", editable = true }
glasshouse-forecast = { path = "../forecast", editable = true }
glasshouse-settlement = { path = "../settlement-engine", editable = true }
