[project]
name = "glasshouse-api"
version = "0.1.0"
description = "FastAPI service wiring ingestion, forecast, and the Rust settlement engine into one live-price endpoint."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "glasshouse-ingestion",
    "glasshouse-forecast",
    "glasshouse-settlement",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
glasshouse-api = "glasshouse_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasshouse_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local, editable path dependencies -- these three sibling packages
# aren't published anywhere, they just live in this same repo. See
# docs/adr/0001-python-rust-boundary.md for why glasshouse-settlement
# specifically is a compiled Rust extension rather than plain Python:
# this is what lets the API import and call it in-process, no HTTP hop.
[tool.uv.sources]
glasshouse-ingestion = { path = "../ingestion", editable = true }
glasshouse-forecast = { path = "../forecast", editable = true }
glasshouse-settlement = { path = "../settlement-engine", editable = true }
