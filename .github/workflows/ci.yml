name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # uv venv, not --system: ubuntu-latest's system Python is PEP
      # 668 "externally managed" (same protection Debian/Ubuntu ship by
      # default on real machine) -- --system tries to install straight
      # into it and gets blocked. This now matches exactly the commands
      # documented in ingestion/README.md and run by setup.sh, rather
      # than being a third, CI-only pattern..
      - run: uv venv
        working-directory: ingestion
      - run: uv pip install -e ".[dev]"
        working-directory: ingestion
      - run: uv run pytest -v
        working-directory: ingestion

  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv venv
        working-directory: forecast
      - run: uv pip install -e ".[dev]"
        working-directory: forecast
      - run: uv run pytest -v
        working-directory: forecast

  settlement-engine-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain, not actions-rs/toolchain -- the latter's
      # org was archived in Oct 2023 and is unmaintained (deprecated
      # Node runtime, no longer receives fixes). This is the actively
      # maintained community-standard replacement.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: settlement-engine

  settlement-engine-python-bridge:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv venv
        working-directory: settlement-engine
      - run: uv pip install -e . && uv pip install pytest
        working-directory: settlement-engine
      - run: uv run pytest python/test_bridge.py -v
        working-directory: settlement-engine

  api:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # uv venv (not --system) because installing glasshouse-settlement
      # as a local path dependency invokes maturin, which needs a real
      # virtualenv to build into -- same reason settlement-engine's own
      # job above does the same thing.
      - run: uv venv
        working-directory: api
      - run: uv pip install -e ".[dev]"
        working-directory: api
      - run: uv run pytest -v
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv venv
        working-directory: frontend
      - run: uv pip install -e ".[dev]"
        working-directory: frontend
      - run: uv run python manage.py migrate --no-input
        working-directory: frontend
      - run: uv run pytest -v
        working-directory: frontend
