name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
        working-directory: ingestion
      - run: uv run --directory ingestion pytest -v

  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
        working-directory: forecast
      - run: uv run --directory forecast pytest -v

  settlement-engine-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test
        working-directory: settlement-engine

  settlement-engine-python-bridge:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv
        working-directory: settlement-engine
      - run: uv pip install -e . && uv pip install pytest
        working-directory: settlement-engine
      - run: uv run pytest python/test_bridge.py -v
        working-directory: settlement-engine

  api:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@v3
      # uv venv (not --system) because installing glasshouse-settlement
      # as a local path dependency invokes maturin, which needs a real
      # virtualenv to build into -- same reason settlement-engine's own
      # job above does the same thing.
      - run: uv venv
        working-directory: api
      - run: uv pip install -e ".[dev]"
        working-directory: api
      - run: uv run pytest -v
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    needs: settlement-engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@v3
      - run: uv venv
        working-directory: frontend
      - run: uv pip install -e ".[dev]"
        working-directory: frontend
      - run: uv run python manage.py migrate --no-input
        working-directory: frontend
      - run: uv run pytest -v
        working-directory: frontend
